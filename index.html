<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#000000">
<script src="./src/config.js?v=20260930-1"></script>
<script src="./src/storage.js"></script>
<script>(function(){var t=SV_STORAGE.getItem('sv_theme')||'light';document.documentElement.setAttribute('data-theme',t);if(t==='light'){document.querySelector('meta[name="theme-color"]')&&document.querySelector('meta[name="theme-color"]').setAttribute('content','#F5F6F7');}})()</script>
<title>SeraVillas</title>
<link rel="stylesheet" href="./assets/css/fonts.css?v=20261001-design">
<link rel="stylesheet" href="./assets/css/app.css?v=20261002-polish">
<link rel="stylesheet" href="./assets/css/cleaning-planner.css?v=20261001-design">
<link rel="stylesheet" href="./assets/css/workspace.css?v=20261002-top-tabs">
</head>
<body class="workspace">
<!-- ── Setup screen (shown on first open / no secret saved) ── -->
<div class="setup-screen" id="setup-screen" style="display:none">
  <div class="setup-logo">SeraVillas</div>
  <div class="setup-sub">Property management — enter your access key to continue</div>
  <div class="setup-card">
    <div class="setup-card-title">Welcome</div>
    <div class="setup-card-sub">Enter the access key you received from your property manager. It will be saved on this device.</div>
    <div class="field">
      <label>Access key</label>
      <input type="password" id="setup-secret" placeholder="Enter your key…" style="font-size:16px" onkeydown="if(event.key==='Enter')setupSubmit()">
    </div>
    <div class="setup-error" id="setup-error"></div>
    <button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="setupSubmit()">Continue</button>
  </div>
</div>
<div class="app-wrapper">
<div class="main-area">
<header class="workspace-header">
  <div class="logo">SeraVillas</div>
  <nav class="workspace-nav" aria-label="Main navigation">
    <button class="workspace-tab active" id="workspace-calendar" onclick="go('calendar')" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M16 3v4M8 3v4M3 11h18"/></svg>Bookings</button>
    <button class="workspace-tab" id="workspace-cleaning" onclick="go('cleaning')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="m8 15 9-12M5 13l6 4-3 5H2l3-9ZM17 3l3 2"/></svg>Cleaning</button>
    <button class="workspace-tab" id="workspace-more" onclick="openWorkspaceMenu()" aria-haspopup="dialog"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><circle cx="5" cy="12" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/></svg>More<span id="tasks-badge" class="workspace-badge" style="display:none"></span></button>
  </nav>
  <div class="workspace-tools">
    <div class="workspace-sync" role="status"><span class="sync-dot idle" id="sync-dot"></span><span id="sync-label">Not synced</span></div>
    <div class="header-date" id="header-date"></div>
    <button class="workspace-icon" id="refresh-btn" onclick="refreshApp()" title="Refresh data" aria-label="Refresh data"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path d="M21 4v6h-6M20.49 15a9 9 0 1 1-2.12-9.36L21 10"/></svg></button>
    <button id="theme-btn" onclick="toggleTheme()" title="Switch to dark mode" aria-label="Switch to dark mode"></button>
  </div>
</header>
<main class="content" id="content" aria-label="Property workspace"></main>
</div>
</div>
<div class="toast-wrap"><div class="toast" id="toast"></div></div>
<div id="modal-root"></div>
<input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
<input type="file" id="photo-file" accept="image/*" capture="environment" style="display:none" onchange="handlePhoto(event)">
<input type="file" id="issue-photo-file" accept="image/*" capture="environment" style="display:none" onchange="handleIssuePhoto(event)">
<input type="file" id="task-photo-file" accept="image/*" capture="environment" style="display:none" onchange="handleTaskPhoto(event)">
<script src="./src/dev-seed.js"></script>
<script src="./src/state/store.js?v=20261002-top-tabs"></script>
<script src="./src/data/local-data.js"></script>
<script src="./src/utils/dates.js"></script>
<script src="./src/ui/shell.js?v=20261002-top-tabs"></script>
<script src="./src/ui/workspace.js?v=20261002-top-tabs"></script>
<script src="./src/features/home.js"></script>
<script src="./src/ui/voice.js"></script>
<script src="./src/features/reports.js?v=20261001-1"></script>
<script src="./src/features/calendar.js?v=20261002-top-tabs"></script>
<script src="./src/features/tasks.js"></script>
<script src="./src/features/cleaning-planner.js?v=20261001-cleaning"></script>
<script src="./src/features/cleanings.js?v=20261001-cleaning"></script>
<script src="./src/features/issues.js"></script>
<script src="./src/features/manage.js?v=20261001-team"></script>
<script src="./src/features/properties.js?v=20261001-cleaning"></script>
<script src="./src/ui/actions.js?v=20261002-top-tabs"></script>
<script src="./src/data/sync-merge.js?v=20261001-team"></script>
<script src="./src/data/cloud-sync.js?v=20261001-team"></script>
<script src="./src/auth/cleaner-access.js?v=20261001-team"></script>
<script src="./src/auth/session.js?v=20261002-top-tabs"></script>
<script src="./src/data/legacy-booking-migrations.js?v=20261001-retired"></script>
<script src="./assets/vendor/sheetjs/xlsx-0.20.3.min.js"></script>
<script src="./src/imports/excel-bookings.js?v=20261001-2027"></script>
<script src="./src/ui/excel-import.js?v=20261001-2027"></script>
<script src="./src/app.js?v=20261002-polish"></script>
</body>
</html>
